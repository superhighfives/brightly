name: Preview Deploy

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Upload to Cloudflare Workers
        id: upload
        run: |
          npm run upload 2>&1 | tee /tmp/upload_output.txt
          exit_code=${PIPESTATUS[0]}
          preview_url=$(grep -oP 'Version Preview URL: \K\S+' /tmp/upload_output.txt | head -1)
          if [ -n "$preview_url" ]; then
            echo "preview_url=$preview_url" >> $GITHUB_OUTPUT
          fi
          exit $exit_code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const previewUrl = '${{ steps.upload.outputs.preview_url }}';
            const marker = '<!-- preview-deploy -->';
            const body = [
              marker,
              '## Preview Deploy',
              '',
              previewUrl
                ? `✅ Preview: ${previewUrl}`
                : '✅ Uploaded to Cloudflare Workers.\n\n> **Note:** Set `CLOUDFLARE_ACCOUNT_SUBDOMAIN` in repository variables to get a preview URL.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
